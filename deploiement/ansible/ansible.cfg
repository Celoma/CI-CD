[defaults]
interpreter_python = /usr/bin/python3
retry_files_enabled = False
# Laisse le temps à sudo de répondre sur une VM chargée (mises à jour au 1er démarrage)
timeout = 60
callback_result_format = yaml
# Mot de passe Vault : fichier local ignoré par Git, ou variable CI masquée
vault_password_file = ./.vault_pass

[ssh_connection]
# Identité des serveurs vérifiée avec known_hosts (généré par Terraform)
ssh_args = -o UserKnownHostsFile=./known_hosts -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
