# ======================================================
# Préparation des serveurs (staging et production)
#   ansible-playbook -i inventories/staging playbook.yml
#
# - met à jour le système et installe les dépendances
# - installe Docker Engine et le plugin Docker Compose (dépôt officiel Docker)
# - active et démarre le service Docker
# - crée le répertoire de déploiement et vérifie les services
# Idempotent : peut être relancé sans effet de bord.
# ======================================================
- name: Préparer les serveurs SouverainRecrut
  hosts: app
  become: true

  tasks:
    - name: Mettre à jour le cache APT et les paquets installés
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        upgrade: safe

    - name: Installer les dépendances système
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg]
        state: present

    - name: Créer le dossier des clés APT
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Récupérer la clé GPG du dépôt Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Déclarer le dépôt APT officiel Docker
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        filename: docker
        state: present

    - name: Installer Docker Engine et le plugin Docker Compose
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Activer et démarrer le service Docker
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true

    - name: Autoriser l'utilisateur de déploiement à utiliser Docker
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: Créer le répertoire de déploiement
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0750"

    - name: Vérifier Docker et Docker Compose
      ansible.builtin.command: "{{ item }}"
      loop:
        - docker --version
        - docker compose version
      register: docker_check
      changed_when: false

    - name: Afficher les versions installées
      ansible.builtin.debug:
        msg: "{{ docker_check.results | map(attribute='stdout') | list }}"
