# ======================================================
# Jenkins Configuration as Code (JCasC)
# Les valeurs ${...} sont lues dans les variables d'environnement
# du conteneur (fichier integration-continue/jenkins/.env).
# ======================================================
jenkins:
  systemMessage: "Jenkins CI - SouverainRecrut Backend"
  numExecutors: 2
  mode: NORMAL

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "${JENKINS_URL:-http://localhost:8080/}"

  # Serveur SonarQube utilisé par withSonarQubeEnv('sonarqube')
  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: "sonarqube"
        serverUrl: "http://sonarqube:9000"
        credentialsId: "sonar-token"

credentials:
  system:
    domainCredentials:
      - credentials:
          # Docker Hub (credentialsId: dockerhub-credentials)
          - usernamePassword:
              scope: GLOBAL
              id: "dockerhub-credentials"
              description: "Docker Hub"
              username: "${DOCKERHUB_USERNAME}"
              password: "${DOCKERHUB_TOKEN}"
              usernameSecret: false
          # Token d'analyse SonarQube (généré par sonar/setup-sonarqube.sh)
          - string:
              scope: GLOBAL
              id: "sonar-token"
              description: "SonarQube - token d'analyse"
              secret: "${SONAR_TOKEN}"
          # cosign : clé privée de signature (PEM encodé en base64) et son mot de passe
          - string:
              scope: GLOBAL
              id: "cosign-key"
              description: "cosign - clé privée de signature des images (base64)"
              secret: "${COSIGN_KEY_B64}"
          - string:
              scope: GLOBAL
              id: "cosign-password"
              description: "cosign - mot de passe de la clé"
              secret: "${COSIGN_PASSWORD}"
          # GitLab : jeton de déclenchement du pipeline de déploiement
          - string:
              scope: GLOBAL
              id: "gitlab-trigger-token"
              description: "GitLab - déclenchement du pipeline de déploiement"
              secret: "${GITLAB_TRIGGER_TOKEN}"

# Job multibranche : un pipeline par branche du dépôt Git (dont Dev).
# Le scan périodique (toutes les 2 minutes) détecte les nouveaux commits
# et déclenche automatiquement un build de la branche concernée.
jobs:
  - script: >
      multibranchPipelineJob('souverainrecrut-backend') {
        displayName('SouverainRecrut Backend - CI')
        description('Tests, SonarQube, image Docker, Trivy, publication Docker Hub')
        branchSources {
          git {
            id('souverainrecrut-git')
            remote('${GIT_REPO_URL}')
          }
        }
        factory {
          workflowBranchProjectFactory {
            scriptPath('integration-continue/Jenkinsfile')
          }
        }
        triggers {
          periodicFolderTrigger {
            interval('2m')
          }
        }
        orphanedItemStrategy {
          discardOldItems {
            numToKeep(10)
          }
        }
      }
