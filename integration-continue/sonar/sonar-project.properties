# ======================================================
# Paramètres d'analyse SonarQube - SouverainRecrut Backend
# Utilisé depuis le dossier backend/ :
#   sonar-scanner -Dproject.settings=../integration-continue/sonar/sonar-project.properties
# (les chemins ci-dessous sont relatifs à backend/)
# ======================================================
sonar.projectKey=souverainrecrut-backend
sonar.projectName=SouverainRecrut Backend
sonar.sourceEncoding=UTF-8

# Code applicatif et tests
sonar.sources=src
sonar.tests=tests
sonar.exclusions=src/docs/**

# Couverture produite par Jest (npm run test:ci)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/server.ts,src/types/**

sonar.typescript.tsconfigPaths=tsconfig.json
